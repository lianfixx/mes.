name: Control entre IA

# En cada push y pull request, venga de la IA o persona que venga: registro con «Agente:» en CHANGELOG.md,
# y que lo agregado no traiga llaves, contraseñas, CURP, tarjetas ni archivos de credenciales.
# Solo revisa lo que el cambio agrega. Marca en rojo; no revierte. Ver ia/verificar.py e ia/PROTOCOLO.md.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Registro y secretos
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 ia/verificar.py ci --base "$BASE" --head "$GITHUB_SHA"
